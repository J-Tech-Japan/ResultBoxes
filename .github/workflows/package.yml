name: nuget package release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to push (must match PackageVersion in ResultBoxes.csproj)
        required: true

jobs:
  build:

    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
    - name: Restore dependencies
      run: |
        pushd ./src/ResultBoxes
        dotnet restore ResultBoxes.sln
    - name: Build with dotnet
      run: |
        pushd ./src/ResultBoxes
        dotnet build ResultBoxes.sln -c Release
    - name: Test
      run: |
        pushd ./src/ResultBoxes
        dotnet test ResultBoxes.sln -c Release --no-build
    - name: Check package exists for version
      run: test -f "src/ResultBoxes/ResultBoxes/bin/Release/ResultBoxes.${PACKAGE_VERSION}.nupkg"
    - name: Mint short-lived NuGet key (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      with:
        user: J-Tech-Japan
    - name: Push ResultBoxes
      env:
        NUGET_APIKEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "src/ResultBoxes/ResultBoxes/bin/Release/ResultBoxes.${PACKAGE_VERSION}.nupkg" --api-key "$NUGET_APIKEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
